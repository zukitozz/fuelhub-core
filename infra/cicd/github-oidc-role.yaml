# FuelHub Cloud -- rol de IAM que GitHub Actions asume via OIDC para
# desplegar (seccion 12.5/13.5 del spec). NO se aplica desde el propio
# pipeline (seria el huevo y la gallina: el pipeline necesita este rol para
# poder autenticarse contra AWS) -- lo aplica Jorge una sola vez, a mano,
# desde su cuenta de AWS (Opcion A: todo lo que toca cuentas de AWS/GitHub
# lo corre el, nunca pasa por Claude ni por credenciales compartidas en el
# chat).
#
# Que NO hace este rol: no le da a GitHub Actions permisos directos sobre
# Lambda/API Gateway/RDS/Cognito/etc. Eso seria mal diseno frente a como
# funciona `cdk deploy` de verdad (CDK v2, "new-style synthesis" -- ver
# infra/cdk.json, no tiene ninguna config vieja que la desactive): la
# identidad que invoca `cdk deploy` (aca, este rol) nunca crea recursos de
# AWS directamente. Sube los assets (codigo de cada Lambda) usando el
# file-publishing-role que ya crea `cdk bootstrap`, y le pide a
# CloudFormation que aplique el stack pasandole el cfn-exec-role (tambien de
# `cdk bootstrap`) -- es CloudFormation, no GitHub Actions, quien termina
# creando/modificando cada recurso real, usando los permisos de ESE rol.
#
# Por eso lo unico que este rol necesita es sts:AssumeRole sobre los 3 roles
# del "toolkit" de CDK (deploy-role, file-publishing-role, lookup-role) --
# nada mas. Es la interpretacion correcta de "minimo privilegio" para este
# caso concreto, no una lista de servicios a mano (Lambda, API Gateway, RDS,
# Cognito...) que igual no la usaria `cdk deploy` desde el lado del caller.
#
# Lo que SI queda abierto (documentado a proposito, no un descuido): los
# permisos reales de creacion de recursos los define el cfn-exec-role que ya
# existe en la cuenta desde que corriste `cdk bootstrap` la primera vez
# (seccion 13.3, Fase 1 -- "la cuenta/region de nonato, us-east-2, ya lo
# esta"). Por default ese rol trae AdministratorAccess, y -- importante,
# porque esta cuenta de AWS no es solo de FuelHub -- es el MISMO rol
# compartido que usan tus otros proyectos con CDK en la misma cuenta/region
# (mismo qualifier hnb659fds, el default). Achicarlo aca romperia esos otros
# proyectos sin avisar. Si en algun momento queres que FuelHub tenga su
# propio cfn-exec-role acotado a los servicios reales que usa (aislado de
# tus otros proyectos, con su propio
# `cdk bootstrap --qualifier fuelhub2026 --cloudformation-execution-policies <policy-propia>`),
# es un cambio real pero separado de este archivo -- avisame si lo queres y
# lo armamos aparte.
#
# Sobre el recurso GithubOidcProvider de abajo: el identity provider de
# GitHub Actions es UNICO POR CUENTA DE AWS, no por proyecto. Si ya lo
# creaste antes para otro repo tuyo (revisa IAM > Identity providers en la
# consola ANTES de aplicar este stack), usa CrearProveedorOIDC=false +
# ProveedorOIDCArnExistente en vez de este recurso. El ThumbprintList de
# abajo es un requisito de forma del recurso CloudFormation -- desde 2023
# IAM valida el certificado real de GitHub contra su propia lista de
# proveedores conocidos y no depende de este valor para decidir la
# confianza, asi que no hace falta que sea el "hash exacto" de nada.
#
# IMPORTANTE (v1.51, descubierto con el primer deploy real): el claim "sub"
# del token OIDC NO siempre es "repo:OWNER/REPO:environment:NOMBRE". Si la
# cuenta de GitHub o el repo fueron renombrados alguna vez en su historia,
# GitHub le agrega el ID interno inmutable de cada uno, con la forma
# "repo:OWNER@ID_OWNER/REPO@ID_REPO:environment:NOMBRE" -- es una proteccion
# de GitHub para que, si alguien registra despues el nombre viejo, no pueda
# fabricar un token que matchee una trust policy vieja basada solo en el
# nombre. Se confirmo esto imprimiendo el token real en un paso de
# diagnostico temporal del workflow (ver deploy-grupo.yml, retirado despues
# de esta correccion) -- el sub real fue
# "repo:zukitozz@212289646/fuelhub-core@1350969551:environment:dev-nonato".
# Por eso GitHubOrgId/GitHubRepoId abajo son parte del "nombre" real que hay
# que matchear, no datos opcionales.

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  FuelHub Cloud - rol de IAM (OIDC) para que GitHub Actions despliegue sin
  credenciales de larga duracion (secciones 12.5/13.5). Ver comentarios al
  inicio del archivo fuente para el detalle completo del diseno.

Parameters:
  GitHubOrg:
    Type: String
    Default: zukitozz
    Description: Usuario/organizacion de GitHub dueno del repo.

  GitHubRepo:
    Type: String
    Default: fuelhub-core
    Description: Nombre del repo (sin el org/usuario delante).

  GitHubOrgId:
    Type: String
    Default: '212289646'
    Description: >-
      ID interno inmutable de la cuenta/organizacion de GitHub (numerico).
      GitHub lo agrega al claim "sub" del token OIDC como OWNER@ID cuando la
      cuenta fue renombrada alguna vez -- ver el comentario grande al inicio
      del archivo. Se obtiene imprimiendo el token real (paso de diagnostico
      temporal) o vía GET /users/<usuario> de la API de GitHub (campo "id").

  GitHubRepoId:
    Type: String
    Default: '1350969551'
    Description: >-
      ID interno inmutable del repo (numerico), mismo motivo que
      GitHubOrgId. Se obtiene vía GET /repos/<owner>/<repo> de la API de
      GitHub (campo "id").

  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: >-
      El qualifier de tu cdk bootstrap - hnb659fds es el default de CDK
      (ver infra/cdk.json, no tiene @aws-cdk/core:bootstrapQualifier
      seteado, asi que aplica el default).

  CrearProveedorOIDC:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      'false' si ya existe un identity provider de
      token.actions.githubusercontent.com en tu cuenta (de otro proyecto) -
      revisalo en IAM > Identity providers antes de aplicar este stack.

  ProveedorOIDCArnExistente:
    Type: String
    Default: ''
    Description: >-
      Solo si CrearProveedorOIDC=false: ARN del provider existente
      (arn:aws:iam::<cuenta>:oidc-provider/token.actions.githubusercontent.com).

Conditions:
  DebeCrearProveedor: !Equals [!Ref CrearProveedorOIDC, 'true']

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: DebeCrearProveedor
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  FuelHubGitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FuelHubGitHubActionsDeployRole
      Description: >-
        Asumido por GitHub Actions (repo zukitozz/fuelhub-core) via OIDC
        para correr cdk deploy - secciones 12.5/13.5. Sin credenciales de
        larga duracion en GitHub.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - DebeCrearProveedor
                - !Ref GithubOidcProvider
                - !Ref ProveedorOIDCArnExistente
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Solo jobs que corren DENTRO de un GitHub Environment de
                # este repo (deploy-dev/deploy-prod en deploy-grupo.yml,
                # cada uno atado a dev-<grupo>/prod-<grupo> - seccion 13.5)
                # piden un token cuyo "sub" tiene esta forma. El job synth
                # (sin `environment:`, ver deploy-grupo.yml) nunca puede
                # pedir un token que matchee esto - ni falta que le haga, no
                # llama a configure-aws-credentials. El wildcard final cubre
                # cualquier grupo futuro (13.3) sin tener que volver a tocar
                # este rol cada vez que se da de alta uno nuevo.
                #
                # OWNER@ID_OWNER/REPO@ID_REPO, no OWNER/REPO a secas -- ver
                # el comentario grande al inicio del archivo (v1.51).
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:environment:*'
      Policies:
        - PolicyName: AsumirRolesToolkitCDK
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-deploy-role-${AWS::AccountId}-us-east-2'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-file-publishing-role-${AWS::AccountId}-us-east-2'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-lookup-role-${AWS::AccountId}-us-east-2'

Outputs:
  DeployRoleArn:
    Description: >-
      Valor para el secret de repo AWS_DEPLOY_ROLE_ARN (Settings > Secrets
      and variables > Actions > New repository secret - no un secret de
      Environment, seccion 13.5).
    Value: !GetAtt FuelHubGitHubActionsDeployRole.Arn
